name: cla
# Contributor License Agreement check (CLA.md), with CLA Assistant Lite: a contributor signs by commenting on their
# pull request; signatures are stored as JSON on this repository's `cla-signatures` branch (not `main`, which gets one
# commit per public release). Only the built-in GITHUB_TOKEN is used. The action never checks out pull request code.
# contributor-assistant/github-action is archived upstream (its releases keep working); pinned to v2.6.1's commit.
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
        (github.event.comment.body == 'recheck' ||
         github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    steps:
      - name: CLA Assistant
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/${{ github.repository }}/blob/main/CLA.md
          path-to-signatures: signatures/version1/cla.json
          branch: cla-signatures
          allowlist: alexcarney460-hue,dependabot[bot],github-actions[bot]
          custom-notsigned-prcomment: >-
            Thanks for the pull request! Before it can be accepted, please read the
            [Contributor License Agreement](https://github.com/${{ github.repository }}/blob/main/CLA.md)
            and sign it by posting the comment below on this pull request. You only need to do this once.
