  <main class="screen">
    <div class="brand"><span class="logo" aria-hidden="true"></span>Sqwakie</div>
    <h1>Reset Sqwakie on this phone</h1>
    <p class="lede">This forgets the pairing, the saved app and its offline copy on this phone. Your computer keeps its
      list of phones: sign this one out there too (<code>walkie mobile revoke</code> or Team → Devices), then pair again
      with <code>walkie mobile pair</code>.</p>
    <p class="row">
      <button type="button" class="btn-danger" id="reset">Reset this phone</button>
      <a class="btn-ghost" href="/m">Cancel</a>
    </p>
    <p class="muted small" id="status" role="status" aria-live="polite"></p>
