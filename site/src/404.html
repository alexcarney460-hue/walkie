<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Page not found: {{name}}</title>
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#211f1d">
  <!-- Served for any missing path, at any depth: every URL here is absolute. No analytics: the path may be anything a visitor typed. -->
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="/assets/fonts/archivo-var-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/assets/site.css">
  <script src="/assets/site.js" defer></script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <svg class="filter-defs" aria-hidden="true" focusable="false"><filter id="sq-liquid" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency="0.004 0.009" numOctaves="2" seed="8" result="noise"/><feDisplacementMap in="SourceGraphic" in2="noise" scale="18" xChannelSelector="R" yChannelSelector="G"/></filter></svg>
  <header class="nav-wrap">
    <nav class="nav nav-compact glass" aria-label="Primary">
      <a class="brand" href="/" aria-label="{{name}} home">
        <svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><rect x="1" y="1" width="30" height="30" rx="8"/><path class="m1" d="M9 13h11"/><path class="m2" d="M12.5 19.5h11"/></svg>
        <span>{{name}}</span>
      </a>
      <ul class="nav-links">
        <li><a href="/#pricing">Pricing</a></li>
        <li><a href="/#faq">FAQ</a></li>
      </ul>
    </nav>
  </header>

  <main id="main" class="welcome">
    <div class="wrap">
      <div class="welcome-card notfound-card">
        <h1>Page not found.</h1>
        <p class="lead">{{name}} puts every Claude Code and Codex session on your team on one live dashboard, on your desk and on your phone.</p>
        <div class="install glass">
          <div class="install-shell">
            <div class="install-core">
              <code class="install-cmd"><span class="p" aria-hidden="true">$</span> <span data-copy-src>{{install}}</span></code>
              <button class="copy glass" type="button" data-copy aria-label="Copy install command"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8.5" y="8.5" width="11" height="11" rx="2.5"/><path d="M15.5 8.5V6A1.5 1.5 0 0 0 14 4.5H6A1.5 1.5 0 0 0 4.5 6v8A1.5 1.5 0 0 0 6 15.5h2.5"/></svg><span data-copy-label>Copy</span></button>
            </div>
          </div>
          <p class="install-note">Free for 2 people. Macs with Apple Silicon, and Linux.</p>
        </div>
        <a class="btn btn-primary glass" href="/">Back to the home page</a>
      </div>
    </div>
  </main>
  <div class="sr-only" aria-live="polite" data-announce></div>
</body>
</html>
